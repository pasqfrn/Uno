<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>CyberChat C-Server Elite</title>
    <style>
        :root { 
            --neon-blue: #00d4ff; 
            --neon-green: #00ff88; 
            --neon-purple: #bc13fe;
            --neon-pink: #ff0055;
            --neon-yellow: #ffff00;
        }
        
        body { 
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); 
            color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; margin: 0; overflow: hidden;
            background-attachment: fixed;
        }

        /* LOBBY */
        #lobby { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .glass-card { 
            background: rgba(0, 0, 0, 0.7); padding: 50px; border-radius: 20px;
            backdrop-filter: blur(20px); border: 2px solid var(--neon-blue); 
            text-align: center; box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }
        .glass-card input { 
            display: block; width: 100%; margin-bottom: 20px; box-sizing: border-box; 
            padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: white;
        }

        /* CHAT CONTAINER */
        #chatContainer { display: none; flex-direction: column; height: 100vh; position: relative; }
        
        /* HEADER */
        #roomLabel { position: absolute; top: 20px; left: 25px; color: var(--neon-blue); font-weight: bold; font-family: monospace; font-size: 1.1rem; text-shadow: 0 0 10px var(--neon-blue); z-index: 10; }
        #sessionTimer { position: absolute; top: 20px; right: 25px; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; border-radius: 10px; font-family: monospace; box-shadow: 0 0 10px var(--neon-green); z-index: 10; }

        /* AREA MESSAGGI */
        #chat { 
            flex: 1; overflow-y: auto; padding: 100px 40px 40px 40px; 
            display: flex; flex-direction: column; gap: 15px; 
            scrollbar-width: none;
        }
        #chat::-webkit-scrollbar { display: none; }

        .msg { background: rgba(255, 255, 255, 0.05); padding: 12px 18px; border-radius: 15px; max-width: 70%; font-family: 'Courier New', monospace; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); }
        .msg.me { align-self: flex-end; background: rgba(0, 212, 255, 0.2); color: var(--neon-blue); font-weight: 600; border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

        /* MESSAGGI ADMIN (Stile Giallo Figo) */
        .msg.admin { 
            align-self: center; 
            background: rgba(255, 255, 0, 0.05); 
            color: var(--neon-yellow); 
            border: 1px dashed var(--neon-yellow); 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.15);
            padding: 8px 25px;
        }

        /* BARRA FLUTTUANTE */
        .controls { 
            padding: 30px 50px; 
            background: rgba(0, 0, 0, 0.2); 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            backdrop-filter: blur(15px); 
            border-top: 1px solid rgba(0, 212, 255, 0.5);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
        }

        #msgInput { 
            flex: 1; 
            padding: 18px 25px; 
            border-radius: 5px; 
            border: 1px solid rgba(0, 212, 255, 0.4); 
            background: rgba(255, 255, 255, 0.02); 
            color: white; 
            outline: none; 
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            transition: 0.3s;
        }

        #msgInput:focus { 
            border-color: var(--neon-blue); 
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); 
        }

        /* BOTTONI */
        button { 
            padding: 15px 35px; 
            border-radius: 3px; 
            border: 1px solid var(--neon-blue); 
            background: transparent; 
            color: var(--neon-blue); 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        button:hover { 
            background: var(--neon-blue); 
            color: #0f0c29;
            box-shadow: 0 0 30px var(--neon-blue); 
        }

        .exit-btn { border-color: var(--neon-pink); color: var(--neon-pink); }
        .exit-btn:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 30px var(--neon-pink); }

        /* MENU TAG @ */
        #mentionMenu {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 12, 41, 0.95); border: 1px solid var(--neon-blue);
            display: none; flex-direction: column; z-index: 100; min-width: 220px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .mention-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid rgba(0, 212, 255, 0.1); font-family: monospace; color: var(--neon-blue); }
        .mention-item:hover { background: var(--neon-blue); color: black; }

    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <div class="glass-card">
            <h1 style="color:var(--neon-blue); letter-spacing:8px; text-shadow: 0 0 15px var(--neon-blue);">CYBER_CORE</h1>
            <input type="text" id="userName" placeholder="NICKNAME">
            <input type="text" id="roomCode" placeholder="ROOM_ID">
            <div style="display:flex; gap:10px;">
                <button onclick="join()" style="flex:1">LOGIN</button>
                <button onclick="document.getElementById('roomCode').value = Math.random().toString(36).substring(7).toUpperCase()" style="border-color:var(--neon-purple); color:var(--neon-purple);">RAND</button>
            </div>
        </div>
    </div>

    <!-- CHAT CONTAINER -->
    <div id="chatContainer">
        <div id="roomLabel">NODE: <span id="currentRoom"></span></div>
        <div id="sessionTimer">00:00:00</div>
        
        <div id="chat"></div>
        <div id="mentionMenu"></div>

        <div class="controls">
            <input type="text" id="msgInput" placeholder="Inserisci pacchetto dati..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">SEND</button>
            <button class="exit-btn" onclick="location.reload()">ABORT</button>
        </div>
    </div>

    <script>
        let ws, user, room, onlineUsers = [];
        
        function join() {
            user = document.getElementById('userName').value.trim();
            room = document.getElementById('roomCode').value.trim();
            if(!user || !room) return alert("LOGIN_FAILED: Missing Credentials");

            ws = new WebSocket("ws://" + window.location.host + "/ws");
            
            ws.onopen = () => {
                ws.send("JOIN:" + room + ":" + user);
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'flex';
                document.getElementById('currentRoom').textContent = room;
                startTimer();
            };

            ws.onmessage = (e) => {
                if(e.data.startsWith("LIST:")) {
                    onlineUsers = e.data.substring(5).split(",").filter(u => u !== "" && u !== user);
                    return;
                }

                const div = document.createElement('div');
                
                // LOGICA SPECIALE: Se il messaggio inizia con "!" (nostro segnale server)
                if (e.data.startsWith("!")) {
                    div.className = 'msg admin';
                    // Rimuoviamo il punto esclamativo per mostrare solo il testo
                    div.textContent = e.data.substring(1); 
                } 
                // Retrocompatibilità se vuoi ancora "Admin:"
                else if (e.data.startsWith("Admin:")) {
                    div.className = 'msg admin';
                    div.textContent = e.data.replace("Admin: ", ""); // Togliamo la scritta ma teniamo il bordo
                }
                else {
                    const msgContent = e.data.substring(11); 
                    div.className = msgContent.startsWith(user + ":") ? 'msg me' : 'msg';
                    div.textContent = e.data;
                }
                
                document.getElementById('chat').appendChild(div);
                document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            };
        }

        function send() {
            const input = document.getElementById('msgInput');
            if(input.value.trim() && ws) {
                ws.send(user + ": " + input.value);
                input.value = "";
                document.getElementById('mentionMenu').style.display = "none";
            }
        }

        function startTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                const time = new Date(s * 1000).toISOString().substr(11, 8);
                document.getElementById('sessionTimer').textContent = time;
            }, 1000);
        }

        document.getElementById('msgInput').oninput = function() {
            const menu = document.getElementById('mentionMenu');
            const val = this.value;
            const words = val.split(" ");
            const lastWord = words[words.length - 1];

            if (lastWord.startsWith("@")) {
                const search = lastWord.substring(1).toLowerCase();
                menu.innerHTML = "";
                const filtered = onlineUsers.filter(u => u.toLowerCase().includes(search));

                if (filtered.length > 0) {
                    filtered.forEach(u => {
                        const item = document.createElement('div');
                        item.className = "mention-item";
                        item.textContent = u;
                        item.onclick = () => {
                            words[words.length - 1] = "@" + u + " ";
                            this.value = words.join(" ");
                            menu.style.display = "none";
                            this.focus();
                        };
                        menu.appendChild(item);
                    });
                    menu.style.display = "flex";
                } else {
                    menu.style.display = "none";
                }
            } else {
                menu.style.display = "none";
            }
        };
    </script>
</body>
</html>
